<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloodhound - Interactive Reader</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            line-height: 1.7;
            background-color: #f8f5f0;
            color: #2c2c2c;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            width: 100%;
            margin: 0 auto;
            background-color: #ffffff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            border-radius: 12px;
            padding: 30px 40px;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 400;
            letter-spacing: 1px;
            color: #1a1a1a;
            border-bottom: 2px solid #e0d6cc;
            padding-bottom: 12px;
            margin-bottom: 25px;
            text-align: center;
            font-family: 'Helvetica', 'Arial', sans-serif;
        }

        .nav-container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
            padding: 15px 0;
            border-bottom: 1px solid #eae5df;
        }

        .nav-group {
            flex: 1;
            min-width: 180px;
        }

        .nav-group label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
            color: #7a6e62;
            margin-bottom: 4px;
            font-family: 'Helvetica', 'Arial', sans-serif;
        }

        .nav-group select {
            width: 100%;
            padding: 10px 12px;
            font-size: 1rem;
            font-family: 'Helvetica', 'Arial', sans-serif;
            background-color: #ffffff;
            border: 1px solid #d0c8c0;
            border-radius: 8px;
            color: #2c2c2c;
            cursor: pointer;
        }

        .nav-group select:hover {
            border-color: #a69482;
        }

        .nav-group select:focus {
            outline: none;
            border-color: #8c7a66;
            box-shadow: 0 0 0 3px rgba(140, 122, 102, 0.15);
        }

        .nav-group select:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            background-color: #f4f2ef;
        }

        .content-area {
            padding: 10px 0;
            min-height: 300px;
        }

        .scene-title {
            font-size: 1.8rem;
            font-weight: 400;
            margin-bottom: 20px;
            color: #3d352c;
            border-left: 6px solid #c4b5a5;
            padding-left: 18px;
            font-family: 'Helvetica', 'Arial', sans-serif;
        }

        .scene-content {
            font-size: 1.1rem;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 70vh;
            overflow-y: auto;
            padding-right: 10px;
        }

        .message {
            font-size: 1.1rem;
            color: #7a6e62;
            font-style: italic;
            padding: 40px 0;
            text-align: center;
        }

        .error {
            color: #b14f4f;
            padding: 20px;
            background-color: #fce9e9;
            border-radius: 8px;
            border-left: 5px solid #b14f4f;
        }

        .status {
            font-family: 'Helvetica', 'Arial', sans-serif;
            font-size: 0.85rem;
            color: #7a6e62;
            text-align: center;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #eae5df;
        }

        .debug-info {
            margin-top: 20px;
            padding: 15px;
            background-color: #f5f5f5;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            max-height: 300px;
            overflow-y: auto;
            display: none;
            white-space: pre-wrap;
        }

        .debug-info.visible {
            display: block;
        }

        @media (max-width: 700px) {
            .container {
                padding: 20px;
            }
            h1 {
                font-size: 1.8rem;
            }
            .nav-container {
                flex-direction: column;
            }
            .nav-group {
                min-width: 100%;
            }
            .scene-title {
                font-size: 1.4rem;
            }
            .scene-content {
                font-size: 1rem;
                max-height: 60vh;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Bloodhound — Anthology</h1>

        <div class="nav-container">
            <div class="nav-group">
                <label for="volume-select">Volume</label>
                <select id="volume-select">
                    <option value="">— Loading —</option>
                </select>
            </div>
            <div class="nav-group">
                <label for="episode-select">Episode</label>
                <select id="episode-select" disabled>
                    <option value="">— Select Episode —</option>
                </select>
            </div>
            <div class="nav-group">
                <label for="scene-select">Scene</label>
                <select id="scene-select" disabled>
                    <option value="">— Select Scene —</option>
                </select>
            </div>
        </div>

        <div class="content-area" id="content-area">
            <div class="message">Loading story content...</div>
        </div>

        <div class="status" id="status">Loading the text file...</div>
        
        <button id="debug-toggle" style="margin-top:15px;padding:8px 16px;cursor:pointer;background:#e0d6cc;border:none;border-radius:6px;font-family:inherit;">Show Debug Info</button>
        <div class="debug-info" id="debug-info"></div>
    </div>

    <script>
        (function() {
            'use strict';

            const STORY_FILE = 'bloodhound story scenes-WIP.txt';

            const volumeSelect = document.getElementById('volume-select');
            const episodeSelect = document.getElementById('episode-select');
            const sceneSelect = document.getElementById('scene-select');
            const contentArea = document.getElementById('content-area');
            const statusEl = document.getElementById('status');
            const debugInfo = document.getElementById('debug-info');
            const debugToggle = document.getElementById('debug-toggle');

            let storyData = null;
            let debugLog = [];

            function logDebug(msg) {
                debugLog.push(msg);
                console.log(msg);
                debugInfo.textContent = debugLog.join('\n');
            }

            debugToggle.addEventListener('click', function() {
                debugInfo.classList.toggle('visible');
                this.textContent = debugInfo.classList.contains('visible') ? 'Hide Debug Info' : 'Show Debug Info';
            });

            function setStatus(msg, isError = false) {
                statusEl.textContent = msg;
                statusEl.style.color = isError ? '#b14f4f' : '#7a6e62';
            }

            function showContent(title, content) {
                if (!content) {
                    contentArea.innerHTML = `<div class="message">No content available for this selection.</div>`;
                    return;
                }
                const safeContent = content
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;');
                contentArea.innerHTML = `
                    <h2 class="scene-title">${title || 'Untitled Scene'}</h2>
                    <div class="scene-content">${safeContent}</div>
                `;
            }

            function populateSelect(select, items, defaultLabel) {
                const currentValue = select.value;
                select.innerHTML = '';
                
                const defaultOption = document.createElement('option');
                defaultOption.value = '';
                defaultOption.textContent = defaultLabel || '— Select —';
                defaultOption.disabled = true;
                defaultOption.selected = true;
                select.appendChild(defaultOption);

                if (!items || items.length === 0) {
                    select.disabled = true;
                    return;
                }

                select.disabled = false;
                items.forEach(item => {
                    const option = document.createElement('option');
                    if (typeof item === 'object' && item !== null && 'id' in item) {
                        option.value = item.id;
                        option.textContent = item.label;
                    } else {
                        option.value = item;
                        option.textContent = item;
                    }
                    select.appendChild(option);
                });

                if (currentValue) {
                    const optionExists = Array.from(select.options).some(opt => opt.value === currentValue);
                    if (optionExists) {
                        select.value = currentValue;
                    } else {
                        select.selectedIndex = 0;
                    }
                }
            }

            function parseStory(text) {
                logDebug('=== Starting parse ===');
                const lines = text.split(/\r?\n/);
                
                const volumes = [];
                let currentVolume = null;
                let currentEpisode = null;
                let currentScene = null;
                let sceneContent = [];
                let inScene = false;
                
                let volumeCount = 0;
                let episodeCount = 0;
                let sceneCount = 0;

                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i];
                    const trimmed = line.trim();

                    // Skip empty lines
                    if (trimmed === '') continue;

                    // Check for VOLUME
                    if (trimmed.startsWith('VOLUME')) {
                        logDebug(`Found VOLUME at line ${i+1}: "${trimmed}"`);
                        volumeCount++;
                        episodeCount = 0;
                        sceneCount = 0;
                        
                        if (inScene && currentScene && currentEpisode) {
                            // Clean the scene content before saving
                            const cleanedContent = cleanSceneContent(sceneContent);
                            currentEpisode.scenes.push({
                                id: `scene-${Date.now()}-${Math.random()}`,
                                name: currentScene,
                                content: cleanedContent
                            });
                            sceneContent = [];
                            inScene = false;
                        }
                        if (currentEpisode && currentVolume) {
                            currentVolume.episodes.push(currentEpisode);
                            currentEpisode = null;
                        }
                        
                        const volumeName = trimmed.replace(/^VOLUME\s*/, '').trim() || `Volume ${volumeCount}`;
                        currentVolume = {
                            name: volumeName,
                            episodes: []
                        };
                        volumes.push(currentVolume);
                        logDebug(`Created volume: "${volumeName}"`);
                        continue;
                    }

                    // Check for EPISODE
                    if (trimmed.startsWith('EPISODE')) {
                        logDebug(`Found EPISODE at line ${i+1}: "${trimmed}"`);
                        episodeCount++;
                        sceneCount = 0;
                        
                        if (inScene && currentScene && currentEpisode) {
                            const cleanedContent = cleanSceneContent(sceneContent);
                            currentEpisode.scenes.push({
                                id: `scene-${Date.now()}-${Math.random()}`,
                                name: currentScene,
                                content: cleanedContent
                            });
                            sceneContent = [];
                            inScene = false;
                        }
                        if (currentEpisode && currentVolume) {
                            currentVolume.episodes.push(currentEpisode);
                            currentEpisode = null;
                        }
                        
                        if (!currentVolume) {
                            currentVolume = {
                                name: 'Volume 1',
                                episodes: []
                            };
                            volumes.push(currentVolume);
                        }
                        
                        let episodeName = trimmed.replace(/^EPISODE\s*[:—-]?\s*/, '').trim();
                        if (!episodeName || episodeName === 'EPISODE') {
                            episodeName = `Episode ${episodeCount}`;
                        }
                        
                        if (i + 1 < lines.length) {
                            const nextLine = lines[i + 1].trim();
                            if (nextLine && 
                                !nextLine.startsWith('EPISODE') && 
                                !nextLine.startsWith('SCENE') && 
                                !nextLine.startsWith('VOLUME') &&
                                nextLine !== '______________________________' &&
                                nextLine.length < 60 &&
                                episodeName === `Episode ${episodeCount}`) {
                                episodeName = nextLine;
                                i++;
                                logDebug(`  Using next line as episode name: "${episodeName}"`);
                            }
                        }
                        
                        currentEpisode = {
                            id: `episode-${Date.now()}-${Math.random()}`,
                            name: episodeName,
                            scenes: []
                        };
                        logDebug(`Created episode: "${episodeName}"`);
                        continue;
                    }

                    // Check for SCENE
                    if (trimmed.startsWith('SCENE')) {
                        logDebug(`Found SCENE at line ${i+1}: "${trimmed}"`);
                        sceneCount++;
                        
                        if (inScene && currentScene && currentEpisode) {
                            const cleanedContent = cleanSceneContent(sceneContent);
                            currentEpisode.scenes.push({
                                id: `scene-${Date.now()}-${Math.random()}`,
                                name: currentScene,
                                content: cleanedContent
                            });
                            sceneContent = [];
                        }
                        
                        if (!currentEpisode) {
                            if (!currentVolume) {
                                currentVolume = {
                                    name: 'Volume 1',
                                    episodes: []
                                };
                                volumes.push(currentVolume);
                            }
                            currentEpisode = {
                                id: `episode-${Date.now()}-${Math.random()}`,
                                name: `Episode ${currentVolume.episodes.length + 1}`,
                                scenes: []
                            };
                            currentVolume.episodes.push(currentEpisode);
                            logDebug('Created default episode');
                        }
                        
                        // ALWAYS use generic scene name
                        let sceneName = `Scene ${sceneCount}`;
                        
                        // ONLY use next line if it's a SHORT explicit name
                        if (i + 1 < lines.length) {
                            const nextLine = lines[i + 1].trim();
                            // Check if it's a name (short, doesn't start with quotes, doesn't look like content)
                            const isName = nextLine && 
                                !nextLine.startsWith('SCENE') && 
                                !nextLine.startsWith('EPISODE') && 
                                !nextLine.startsWith('VOLUME') &&
                                nextLine !== '______________________________' &&
                                nextLine.length < 60 &&
                                !nextLine.startsWith('"') && // Don't use if it starts with a quote
                                !nextLine.startsWith("'") && // Don't use if it starts with a quote
                                !nextLine.match(/^[A-Z][a-z]+/); // Doesn't start like a sentence
                            
                            if (isName) {
                                sceneName = nextLine;
                                i++;
                                logDebug(`  Using next line as scene name: "${sceneName}"`);
                            }
                        }
                        
                        currentScene = sceneName;
                        sceneContent = [];
                        inScene = true;
                        logDebug(`Created scene: "${sceneName}" (Scene ${sceneCount})`);
                        continue;
                    }

                    // If we're inside a scene, collect content
                    if (inScene && currentScene) {
                        // Skip divider lines
                        if (trimmed !== '______________________________' && 
                            !trimmed.startsWith('SCENE') && 
                            !trimmed.startsWith('EPISODE') && 
                            !trimmed.startsWith('VOLUME')) {
                            sceneContent.push(line);
                        }
                    }
                }

                // Final cleanup
                if (inScene && currentScene && currentEpisode) {
                    const cleanedContent = cleanSceneContent(sceneContent);
                    currentEpisode.scenes.push({
                        id: `scene-${Date.now()}-${Math.random()}`,
                        name: currentScene,
                        content: cleanedContent
                    });
                }
                if (currentEpisode && currentVolume) {
                    const exists = currentVolume.episodes.some(e => e.id === currentEpisode.id);
                    if (!exists) {
                        currentVolume.episodes.push(currentEpisode);
                    }
                }

                // Log summary
                logDebug(`=== Parse Complete ===`);
                logDebug(`Found ${volumes.length} volumes`);
                volumes.forEach((v, vi) => {
                    logDebug(`  Volume ${vi+1}: "${v.name}" - ${v.episodes.length} episodes`);
                    v.episodes.forEach((e, ei) => {
                        logDebug(`    Episode ${ei+1}: "${e.name}" - ${e.scenes.length} scenes`);
                        e.scenes.forEach((s, si) => {
                            logDebug(`      Scene ${si+1}: "${s.name}" (${s.content.length} chars)`);
                        });
                    });
                });

                return { volumes };
            }

            /**
             * Clean scene content by removing scene names at the end
             * A scene name is identified as a line that has the same indentation level as "SCENE"
             * and appears at the end of the scene
             */
            function cleanSceneContent(contentLines) {
                if (!contentLines || contentLines.length === 0) return '';
                
                // Join all lines
                let fullContent = contentLines.join('\n');
                
                // Find the indentation level of the SCENE tag (look at the first line that's not empty)
                let sceneIndent = '';
                for (let line of contentLines) {
                    if (line.trim() !== '') {
                        const match = line.match(/^(\s*)/);
                        if (match) {
                            sceneIndent = match[1];
                        }
                        break;
                    }
                }
                
                // If we found an indentation level, check if the last non-empty line matches it
                if (sceneIndent) {
                    // Find the last non-empty line
                    let lastNonEmptyIndex = -1;
                    for (let i = contentLines.length - 1; i >= 0; i--) {
                        if (contentLines[i].trim() !== '') {
                            lastNonEmptyIndex = i;
                            break;
                        }
                    }
                    
                    if (lastNonEmptyIndex >= 0) {
                        const lastLine = contentLines[lastNonEmptyIndex];
                        // Check if the last line starts with the same indentation as SCENE
                        // and doesn't start with common content patterns
                        if (lastLine.startsWith(sceneIndent) && 
                            !lastLine.trim().startsWith('"') && 
                            !lastLine.trim().startsWith("'") &&
                            !lastLine.trim().match(/^[A-Z][a-z]+/)) {
                            // Remove the last line
                            contentLines.splice(lastNonEmptyIndex, 1);
                            // Recursively clean in case there are multiple
                            return cleanSceneContent(contentLines);
                        }
                    }
                }
                
                return contentLines.join('\n').trimEnd();
            }

            function updateNavigation() {
                if (!storyData || !storyData.volumes.length) {
                    logDebug('No story data to update navigation');
                    return;
                }

                const volumeNames = storyData.volumes.map(v => v.name);
                logDebug(`Updating volume dropdown with: ${volumeNames.join(', ')}`);
                populateSelect(volumeSelect, volumeNames, '— Select Volume —');
                volumeSelect.disabled = false;

                populateSelect(episodeSelect, [], '— Select Episode —');
                populateSelect(sceneSelect, [], '— Select Scene —');
                contentArea.innerHTML = `<div class="message">Select a volume to begin reading.</div>`;
                setStatus(`Loaded ${storyData.volumes.length} volume(s).`);
            }

            function updateEpisodes() {
                const selectedVolume = volumeSelect.value;
                logDebug(`updateEpisodes called with: "${selectedVolume}"`);
                
                if (!selectedVolume || !storyData) {
                    populateSelect(episodeSelect, [], '— Select Episode —');
                    populateSelect(sceneSelect, [], '— Select Scene —');
                    contentArea.innerHTML = `<div class="message">Select a volume to begin reading.</div>`;
                    return;
                }

                const volume = storyData.volumes.find(v => v.name === selectedVolume);
                if (!volume) {
                    logDebug(`Volume not found: "${selectedVolume}"`);
                    populateSelect(episodeSelect, [], '— Select Episode —');
                    populateSelect(sceneSelect, [], '— Select Scene —');
                    return;
                }

                const episodeItems = volume.episodes.map(e => ({
                    id: e.id,
                    label: e.name
                }));
                logDebug(`Found ${episodeItems.length} episodes for volume "${selectedVolume}"`);
                populateSelect(episodeSelect, episodeItems, '— Select Episode —');
                populateSelect(sceneSelect, [], '— Select Scene —');
                contentArea.innerHTML = `<div class="message">Select an episode to view its scenes.</div>`;
            }

            function updateScenes() {
                const selectedVolume = volumeSelect.value;
                const selectedEpisodeId = episodeSelect.value;
                logDebug(`updateScenes called with volume: "${selectedVolume}", episodeId: "${selectedEpisodeId}"`);
                
                if (!selectedVolume || !selectedEpisodeId || !storyData) {
                    populateSelect(sceneSelect, [], '— Select Scene —');
                    contentArea.innerHTML = `<div class="message">Select an episode to view its scenes.</div>`;
                    return;
                }

                const volume = storyData.volumes.find(v => v.name === selectedVolume);
                if (!volume) {
                    logDebug(`Volume not found: "${selectedVolume}"`);
                    populateSelect(sceneSelect, [], '— Select Scene —');
                    return;
                }

                const episode = volume.episodes.find(e => e.id === selectedEpisodeId);
                if (!episode) {
                    logDebug(`Episode not found with ID: "${selectedEpisodeId}"`);
                    populateSelect(sceneSelect, [], '— Select Scene —');
                    return;
                }

                const sceneItems = episode.scenes.map(s => ({
                    id: s.id,
                    label: s.name
                }));
                logDebug(`Found ${sceneItems.length} scenes for episode "${episode.name}"`);
                populateSelect(sceneSelect, sceneItems, '— Select Scene —');
                contentArea.innerHTML = `<div class="message">Select a scene to read.</div>`;
            }

            function displaySelectedScene() {
                const selectedVolume = volumeSelect.value;
                const selectedEpisodeId = episodeSelect.value;
                const selectedSceneId = sceneSelect.value;
                logDebug(`displaySelectedScene called with: ${selectedVolume} → ${selectedEpisodeId} → ${selectedSceneId}`);

                if (!selectedVolume || !selectedEpisodeId || !selectedSceneId || !storyData) {
                    contentArea.innerHTML = `<div class="message">Please make a selection.</div>`;
                    return;
                }

                const volume = storyData.volumes.find(v => v.name === selectedVolume);
                if (!volume) {
                    logDebug(`Volume not found: "${selectedVolume}"`);
                    return;
                }

                const episode = volume.episodes.find(e => e.id === selectedEpisodeId);
                if (!episode) {
                    logDebug(`Episode not found with ID: "${selectedEpisodeId}"`);
                    return;
                }

                const scene = episode.scenes.find(s => s.id === selectedSceneId);
                if (!scene) {
                    logDebug(`Scene not found with ID: "${selectedSceneId}"`);
                    contentArea.innerHTML = `<div class="error">Scene not found.</div>`;
                    return;
                }

                logDebug(`Displaying scene "${scene.name}" with ${scene.content.length} characters`);
                showContent(scene.name, scene.content);
                setStatus(`Reading: ${selectedVolume} → ${episode.name} → ${scene.name}`);
            }

            // Event handlers
            volumeSelect.addEventListener('change', function() {
                const val = this.value;
                logDebug(`=== Volume changed to: "${val}" ===`);
                episodeSelect.selectedIndex = 0;
                sceneSelect.selectedIndex = 0;
                updateEpisodes();
            });

            episodeSelect.addEventListener('change', function() {
                const val = this.value;
                logDebug(`=== Episode changed to: "${val}" ===`);
                sceneSelect.selectedIndex = 0;
                updateScenes();
            });

            sceneSelect.addEventListener('change', function() {
                const val = this.value;
                logDebug(`=== Scene changed to: "${val}" ===`);
                displaySelectedScene();
            });

            function loadStory() {
                setStatus('Loading story file...');
                logDebug(`=== Fetching file: ${STORY_FILE} ===`);
                
                fetch(STORY_FILE)
                    .then(response => {
                        logDebug(`Response status: ${response.status}`);
                        if (!response.ok) {
                            throw new Error(`HTTP ${response.status}: Could not fetch '${STORY_FILE}'`);
                        }
                        return response.text();
                    })
                    .then(text => {
                        logDebug(`File loaded, ${text.length} characters`);
                        
                        const parsed = parseStory(text);
                        storyData = parsed;
                        
                        if (!storyData.volumes || storyData.volumes.length === 0) {
                            throw new Error('No volumes found in the file.');
                        }

                        updateNavigation();
                        setStatus(`Loaded ${storyData.volumes.length} volume(s).`);
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        logDebug(`ERROR: ${error.message}`);
                        contentArea.innerHTML = `
                            <div class="error">
                                <strong>Error loading story:</strong><br>
                                ${error.message}<br><br>
                                <strong>Check:</strong><br>
                                1. The file <code>${STORY_FILE}</code> is in the same folder.<br>
                                2. The filename matches exactly (case-sensitive).<br>
                                3. The file has the correct format.
                            </div>
                        `;
                        setStatus('Error loading story.', true);
                    });
            }

            loadStory();

        })();
    </script>
</body>
</html>
