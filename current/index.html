<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloodhound - Interactive Reader</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            line-height: 1.7;
            background-color: #f8f5f0;
            color: #2c2c2c;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            width: 100%;
            margin: 0 auto;
            background-color: #ffffff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            border-radius: 12px;
            padding: 30px 40px;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 400;
            letter-spacing: 1px;
            color: #1a1a1a;
            border-bottom: 2px solid #e0d6cc;
            padding-bottom: 12px;
            margin-bottom: 25px;
            text-align: center;
            font-family: 'Helvetica', 'Arial', sans-serif;
        }

        /* Navigation */
        .nav-container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
            padding: 15px 0;
            border-bottom: 1px solid #eae5df;
        }

        .nav-group {
            flex: 1;
            min-width: 180px;
        }

        .nav-group label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
            color: #7a6e62;
            margin-bottom: 4px;
            font-family: 'Helvetica', 'Arial', sans-serif;
        }

        .nav-group select {
            width: 100%;
            padding: 10px 12px;
            font-size: 1rem;
            font-family: 'Helvetica', 'Arial', sans-serif;
            background-color: #ffffff;
            border: 1px solid #d0c8c0;
            border-radius: 8px;
            color: #2c2c2c;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .nav-group select:hover {
            border-color: #a69482;
        }

        .nav-group select:focus {
            outline: none;
            border-color: #8c7a66;
            box-shadow: 0 0 0 3px rgba(140, 122, 102, 0.15);
        }

        .nav-group select:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            background-color: #f4f2ef;
        }

        /* Content */
        .content-area {
            padding: 10px 0;
            min-height: 300px;
        }

        .scene-title {
            font-size: 1.8rem;
            font-weight: 400;
            margin-bottom: 20px;
            color: #3d352c;
            border-left: 6px solid #c4b5a5;
            padding-left: 18px;
            font-family: 'Helvetica', 'Arial', sans-serif;
        }

        .scene-content {
            font-size: 1.1rem;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 70vh;
            overflow-y: auto;
            padding-right: 10px;
        }

        .message {
            font-size: 1.1rem;
            color: #7a6e62;
            font-style: italic;
            padding: 40px 0;
            text-align: center;
        }

        .error {
            color: #b14f4f;
            padding: 20px;
            background-color: #fce9e9;
            border-radius: 8px;
            border-left: 5px solid #b14f4f;
        }

        .status {
            font-family: 'Helvetica', 'Arial', sans-serif;
            font-size: 0.85rem;
            color: #7a6e62;
            text-align: center;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #eae5df;
        }

        /* Responsive */
        @media (max-width: 700px) {
            .container {
                padding: 20px;
            }
            h1 {
                font-size: 1.8rem;
            }
            .nav-container {
                flex-direction: column;
            }
            .nav-group {
                min-width: 100%;
            }
            .scene-title {
                font-size: 1.4rem;
            }
            .scene-content {
                font-size: 1rem;
                max-height: 60vh;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Bloodhound — Anthology</h1>

        <div class="nav-container">
            <div class="nav-group">
                <label for="volume-select">Volume</label>
                <select id="volume-select">
                    <option value="">— Loading —</option>
                </select>
            </div>
            <div class="nav-group">
                <label for="episode-select">Episode</label>
                <select id="episode-select" disabled>
                    <option value="">— Select Episode —</option>
                </select>
            </div>
            <div class="nav-group">
                <label for="scene-select">Scene</label>
                <select id="scene-select" disabled>
                    <option value="">— Select Scene —</option>
                </select>
            </div>
        </div>

        <div class="content-area" id="content-area">
            <div class="message">Loading story content...</div>
        </div>

        <div class="status" id="status">Loading the text file...</div>
    </div>

    <script>
        (function() {
            'use strict';

            const STORY_FILE = 'bloodhound story scenes-WIP.txt';

            const volumeSelect = document.getElementById('volume-select');
            const episodeSelect = document.getElementById('episode-select');
            const sceneSelect = document.getElementById('scene-select');
            const contentArea = document.getElementById('content-area');
            const statusEl = document.getElementById('status');

            let storyData = null;
            let currentSelection = { volume: '', episode: '', scene: '' };

            function setStatus(msg, isError = false) {
                statusEl.textContent = msg;
                statusEl.style.color = isError ? '#b14f4f' : '#7a6e62';
            }

            function showContent(title, content) {
                if (!content) {
                    contentArea.innerHTML = `<div class="message">No content available for this selection.</div>`;
                    return;
                }
                const safeContent = content
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;');
                contentArea.innerHTML = `
                    <h2 class="scene-title">${title || 'Untitled Scene'}</h2>
                    <div class="scene-content">${safeContent}</div>
                `;
            }

            function populateSelect(select, items, defaultLabel) {
                const currentValue = select.value;
                select.innerHTML = '';
                
                const defaultOption = document.createElement('option');
                defaultOption.value = '';
                defaultOption.textContent = defaultLabel || '— Select —';
                defaultOption.disabled = true;
                defaultOption.selected = true;
                select.appendChild(defaultOption);

                if (!items || items.length === 0) {
                    select.disabled = true;
                    return;
                }

                select.disabled = false;
                items.forEach(item => {
                    const option = document.createElement('option');
                    option.value = item;
                    option.textContent = item;
                    select.appendChild(option);
                });

                // Try to restore previous selection
                if (currentValue && items.includes(currentValue)) {
                    select.value = currentValue;
                } else {
                    select.selectedIndex = 0;
                }
            }

            function parseStory(text) {
                const lines = text.split(/\r?\n/);
                const volumes = [];
                let currentVolume = null;
                let currentEpisode = null;
                let currentScene = null;
                let collecting = false;

                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i];
                    const trimmed = line.trim();

                    // Check for VOLUME
                    if (trimmed === '______________________________' && i + 1 < lines.length) {
                        const next = lines[i + 1].trim();
                        if (next.startsWith('VOLUME')) {
                            if (currentScene) {
                                currentEpisode.scenes.push({
                                    name: currentScene.name,
                                    content: currentScene.content.trimEnd()
                                });
                                currentScene = null;
                                collecting = false;
                            }
                            if (currentEpisode) {
                                currentVolume.episodes.push(currentEpisode);
                                currentEpisode = null;
                            }
                            currentVolume = {
                                name: next,
                                episodes: []
                            };
                            volumes.push(currentVolume);
                            i++;
                            continue;
                        }
                    }

                    // Check for EPISODE
                    if (trimmed === '______________________________' && i + 1 < lines.length) {
                        const next = lines[i + 1].trim();
                        if (next.startsWith('EPISODE')) {
                            if (currentScene) {
                                currentEpisode.scenes.push({
                                    name: currentScene.name,
                                    content: currentScene.content.trimEnd()
                                });
                                currentScene = null;
                                collecting = false;
                            }
                            if (currentEpisode && currentVolume) {
                                currentVolume.episodes.push(currentEpisode);
                            }
                            if (!currentVolume) {
                                currentVolume = {
                                    name: 'Unknown Volume',
                                    episodes: []
                                };
                                volumes.push(currentVolume);
                            }
                            currentEpisode = {
                                name: next,
                                scenes: []
                            };
                            i++;
                            continue;
                        }
                    }

                    // Check for SCENE
                    if (trimmed === '______________________________' && i + 1 < lines.length) {
                        const next = lines[i + 1].trim();
                        if (next.startsWith('SCENE')) {
                            if (currentScene) {
                                currentEpisode.scenes.push({
                                    name: currentScene.name,
                                    content: currentScene.content.trimEnd()
                                });
                            }
                            if (!currentEpisode) {
                                if (!currentVolume) {
                                    currentVolume = {
                                        name: 'Unknown Volume',
                                        episodes: []
                                    };
                                    volumes.push(currentVolume);
                                }
                                currentEpisode = {
                                    name: 'Unknown Episode',
                                    scenes: []
                                };
                            }
                            currentScene = {
                                name: next,
                                content: ''
                            };
                            collecting = true;
                            i++;
                            continue;
                        }
                    }

                    // Collect scene content
                    if (collecting && currentScene) {
                        currentScene.content += line + '\n';
                    }
                }

                // Final cleanup
                if (currentScene) {
                    currentEpisode.scenes.push({
                        name: currentScene.name,
                        content: currentScene.content.trimEnd()
                    });
                }
                if (currentEpisode && currentVolume) {
                    currentVolume.episodes.push(currentEpisode);
                }

                return { volumes };
            }

            function updateNavigation() {
                if (!storyData || !storyData.volumes.length) return;

                const volumeNames = storyData.volumes.map(v => v.name);
                populateSelect(volumeSelect, volumeNames, '— Select Volume —');

                // If we have a saved selection, try to restore it
                if (currentSelection.volume) {
                    const volExists = storyData.volumes.some(v => v.name === currentSelection.volume);
                    if (volExists) {
                        volumeSelect.value = currentSelection.volume;
                    }
                }

                // Trigger initial update
                updateEpisodes();
            }

            function updateEpisodes() {
                const selectedVolume = volumeSelect.value;
                if (!selectedVolume || !storyData) {
                    populateSelect(episodeSelect, [], '— Select Episode —');
                    populateSelect(sceneSelect, [], '— Select Scene —');
                    contentArea.innerHTML = `<div class="message">Select a volume to begin reading.</div>`;
                    return;
                }

                const volume = storyData.volumes.find(v => v.name === selectedVolume);
                if (!volume) {
                    populateSelect(episodeSelect, [], '— Select Episode —');
                    populateSelect(sceneSelect, [], '— Select Scene —');
                    return;
                }

                const episodeNames = volume.episodes.map(e => e.name);
                populateSelect(episodeSelect, episodeNames, '— Select Episode —');

                // Restore saved episode selection if possible
                if (currentSelection.episode && episodeNames.includes(currentSelection.episode)) {
                    episodeSelect.value = currentSelection.episode;
                }

                updateScenes();
            }

            function updateScenes() {
                const selectedVolume = volumeSelect.value;
                const selectedEpisode = episodeSelect.value;

                if (!selectedVolume || !selectedEpisode || !storyData) {
                    populateSelect(sceneSelect, [], '— Select Scene —');
                    contentArea.innerHTML = `<div class="message">Select an episode to view its scenes.</div>`;
                    return;
                }

                const volume = storyData.volumes.find(v => v.name === selectedVolume);
                if (!volume) {
                    populateSelect(sceneSelect, [], '— Select Scene —');
                    return;
                }

                const episode = volume.episodes.find(e => e.name === selectedEpisode);
                if (!episode) {
                    populateSelect(sceneSelect, [], '— Select Scene —');
                    return;
                }

                const sceneNames = episode.scenes.map(s => s.name);
                populateSelect(sceneSelect, sceneNames, '— Select Scene —');

                // Restore saved scene selection if possible
                if (currentSelection.scene && sceneNames.includes(currentSelection.scene)) {
                    sceneSelect.value = currentSelection.scene;
                }

                // If we have a scene selected, display it
                if (sceneSelect.value) {
                    displaySelectedScene();
                } else {
                    contentArea.innerHTML = `<div class="message">Select a scene to read.</div>`;
                }
            }

            function displaySelectedScene() {
                const selectedVolume = volumeSelect.value;
                const selectedEpisode = episodeSelect.value;
                const selectedScene = sceneSelect.value;

                if (!selectedVolume || !selectedEpisode || !selectedScene || !storyData) {
                    return;
                }

                const volume = storyData.volumes.find(v => v.name === selectedVolume);
                if (!volume) return;

                const episode = volume.episodes.find(e => e.name === selectedEpisode);
                if (!episode) return;

                const scene = episode.scenes.find(s => s.name === selectedScene);
                if (!scene) return;

                // Save current selection
                currentSelection = {
                    volume: selectedVolume,
                    episode: selectedEpisode,
                    scene: selectedScene
                };

                showContent(scene.name, scene.content);
                setStatus(`Reading: ${selectedVolume} → ${selectedEpisode} → ${selectedScene}`);
            }

            // Event handlers - simplified and direct
            volumeSelect.addEventListener('change', function() {
                currentSelection.episode = '';
                currentSelection.scene = '';
                episodeSelect.selectedIndex = 0;
                sceneSelect.selectedIndex = 0;
                updateEpisodes();
            });

            episodeSelect.addEventListener('change', function() {
                currentSelection.scene = '';
                sceneSelect.selectedIndex = 0;
                updateScenes();
            });

            sceneSelect.addEventListener('change', function() {
                displaySelectedScene();
            });

            // Load the story
            function loadStory() {
                setStatus('Loading story file...');
                fetch(STORY_FILE)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`HTTP ${response.status}: Could not fetch '${STORY_FILE}'`);
                        }
                        return response.text();
                    })
                    .then(text => {
                        const parsed = parseStory(text);
                        storyData = parsed;
                        
                        if (!storyData.volumes || storyData.volumes.length === 0) {
                            throw new Error('No volumes found in the file. Check formatting.');
                        }

                        updateNavigation();
                        setStatus(`Loaded ${storyData.volumes.length} volume(s).`);
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        contentArea.innerHTML = `
                            <div class="error">
                                <strong>Error loading story:</strong><br>
                                ${error.message}<br><br>
                                <strong>Check:</strong><br>
                                1. The file <code>${STORY_FILE}</code> is in the same folder.<br>
                                2. The filename matches exactly (case-sensitive).<br>
                                3. The file has the correct format (VOLUME, EPISODE, SCENE).
                            </div>
                        `;
                        setStatus('Error loading story.', true);
                    });
            }

            loadStory();

        })();
    </script>
</body>
</html>
