<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloodhound — Interactive Reader + TTS</title>
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>📖 <span>Bloodhound</span></h1>

        <div class="file-load-area" id="fileLoadArea">
            <p style="color: #e6edf3; margin-bottom: 12px;">📂 Couldn't auto-load the story. Choose the file manually:</p>
            <input type="file" id="fileInput" accept=".txt">
            <button class="file-btn" onclick="document.getElementById('fileInput').click()">
                Choose File
            </button>
            <span class="file-label">Select: <code>bloodhound story scenes-WIP.txt</code></span>
        </div>

        <div class="nav-container">
            <div class="nav-group">
                <label for="volume-select">Volume</label>
                <select id="volume-select">
                    <option value="">— Loading —</option>
                </select>
            </div>
            <div class="nav-group">
                <label for="episode-select">Episode</label>
                <select id="episode-select" disabled>
                    <option value="">— Select Episode —</option>
                </select>
            </div>
            <div class="nav-group">
                <label for="scene-select">Scene</label>
                <select id="scene-select" disabled>
                    <option value="">— Select Scene —</option>
                </select>
            </div>
        </div>

        <div class="tts-controls">
            <button id="speak-btn" disabled>🔊 Speak Scene</button>
            <button id="pause-btn" disabled>⏸ Pause</button>
            <button id="prev-btn" disabled title="Previous chunk">⏮ Prev</button>
            <button id="replay-btn" disabled title="Replay current chunk">🔁 Replay</button>
            <button id="next-btn" disabled title="Next chunk">⏭ Next</button>
            <button id="stop-btn" disabled>⏹ Stop</button>
            <button id="autoplay-btn" disabled title="Automatically advance to the next scene">🔁 Autoplay: Off</button>
            <button id="help-btn" title="Show help">❓ Help</button>
            <button id="focus-btn" title="Enter focus mode and fullscreen">⛶ Focus Mode</button>
            <span class="wake-lock-indicator" id="wake-lock-indicator" title="Screen will stay awake while narration is playing">🔆 Screen Awake</span>
            <span class="chunk-counter" id="chunk-counter">— / —</span>

            <span class="speed-group">
                <label for="speed-slider">Speed</label>
                <input type="range" id="speed-slider" min="0.5" max="2" step="0.05" value="1.1">
                <span class="speed-readout" id="speed-readout">1.10×</span>
            </span>

            <span class="voice-label">Voice:</span>
            <select id="voice-select" disabled>
                <option value="">— Default —</option>
            </select>
        </div>

        <div class="chunk-panel" id="chunk-panel">
            <div class="chunk-panel-label">Currently speaking:</div>
            <div class="chunk-panel-text is-empty" id="chunk-panel-text">Narrated text will appear here.</div>

            <div class="autoplay-timer" id="autoplayTimer" style="display:none;">
                <span class="timer-label">Auto‑advance in</span>
                <span class="timer-countdown" id="timerCountdown">5</span>
                <span class="timer-label">sec</span>
                <button class="cancel-autoplay-btn" id="cancelAutoplayBtn">✕ Cancel autoplay</button>
            </div>
        </div>

        <div class="scene-nav-row">
            <button id="scene-prev-btn" disabled title="Previous scene">◀ Previous Scene</button>
            <span class="nav-spacer" id="scene-nav-spacer">—</span>
            <button id="scene-next-btn" disabled title="Next scene">Next Scene ▶</button>
        </div>

        <div class="resume-banner" id="resume-banner"></div>

        <div class="content-area" id="content-area">
            <div class="message">Loading story content<span class="loading-dots"></span></div>
        </div>

        <div class="scene-nav-row">
            <button id="scene-prev-btn-bottom" disabled title="Previous scene">◀ Previous Scene</button>
            <span class="nav-spacer" id="scene-nav-spacer-bottom">—</span>
            <button id="scene-next-btn-bottom" disabled title="Next scene">▶ Next Scene</button>
        </div>

        <div class="reader-source-controls">
            <button class="upload-source-btn" id="upload-source-btn" title="Clear the current story and load a .txt file from your computer">
                📂 Load from Computer
            </button>
            <button class="server-source-btn" id="server-source-btn" title="Clear the current story and fetch the latest version from the server">
                🔄 Reload from Server
            </button>
            <button class="clear-story-btn" id="clear-story-btn" title="Unload the current story without touching your saved reading position or preferences">
                🧹 Clear Loaded Story
            </button>
        </div>

        <div class="reader-session-controls">
            <button id="clear-progress-btn" title="Forget the saved reading position for this reader">🗑 Clear Saved Progress</button>
        </div>

        <div class="status" id="status">Loading the text file...</div>
        
        <button class="debug-toggle" id="debug-toggle">📋 Show Debug Info</button>
        <div class="debug-info" id="debug-info"></div>
    </div>

    
    <script src="scripts/index.js"></script>
</body>
</html>
